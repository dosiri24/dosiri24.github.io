<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee Taesoo | Portfolio</title>
    <meta name="description" content="Lee Taesoo 포트폴리오">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/works.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a href="index.html" class="brand">
                <span class="brand-avatar" aria-hidden="true">T</span>
                Lee Taesoo
            </a>
            <a href="index.html" class="nav-link">Works</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
    </header>

    <main class="container">
        <!-- 참여 프로젝트: 팀·회사에서 참여한 작업 (가로형 목록) -->
        <section class="work-section">
            <h2 class="section-title">참여 프로젝트</h2>
            <p class="section-desc">팀 또는 조직의 일원으로 참여한 프로젝트입니다. 맡은 역할을 함께 적었습니다.</p>

            <div class="work-list">
                <!-- 항목 하나 = article.work-row 하나. 복사해서 늘리면 됩니다. -->
                <article class="work-row">
                    <img class="work-thumb" src="images/sample.svg" alt="예시 프로젝트 썸네일">
                    <div class="work-body">
                        <h3 class="work-title">예시 프로젝트</h3>
                        <p class="work-meta"><strong>분야</strong> 웹 서비스</p>
                        <p class="work-desc">프로젝트를 한두 문장으로 소개합니다.</p>
                        <p class="work-meta"><strong>역할</strong> 프론트엔드 개발</p>
                        <p class="work-meta"><strong>소속</strong> 팀 이름 (2025)</p>
                        <div class="work-links">
                            <a class="chip chip-github" href="#" target="_blank" rel="noopener">GitHub</a>
                            <a class="chip chip-demo" href="#" target="_blank" rel="noopener">Demo</a>
                        </div>
                    </div>
                </article>
            </div>
        </section>

        <!-- 개인 프로젝트: 카드형 그리드 -->
        <section class="work-section">
            <h2 class="section-title">개인 프로젝트</h2>

            <div class="work-grid">
                <!-- 카드 하나 = article.work-card 하나 -->
                <article class="work-card">
                    <img class="work-thumb" src="images/sample.svg" alt="예시 프로젝트 썸네일">
                    <div class="work-body">
                        <h3 class="work-title">예시 개인 프로젝트</h3>
                        <p class="work-meta"><strong>분야</strong> 도구 / 자동화</p>
                        <p class="work-desc">무엇을 왜 만들었는지 짧게 적습니다.</p>
                        <div class="work-links">
                            <a class="chip chip-github" href="#" target="_blank" rel="noopener">GitHub</a>
                            <a class="chip chip-youtube" href="#" target="_blank" rel="noopener">YouTube</a>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-links">
            <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
            <span aria-hidden="true">·</span>
            <a href="contact.html">Contact</a>
        </p>
        <p>&copy; <span id="year"></span> Lee Taesoo</p>
    </footer>

    <script src="js/common.js"></script>
</body>
</html>
